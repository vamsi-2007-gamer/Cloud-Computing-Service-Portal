{% extends "base.html" %}
{% block title %}Sign In — CloudSphere{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">☁</div>
    <div class="eyebrow">WELCOME BACK</div>
    <h1>Sign in to CloudSphere</h1>
    <p class="muted">Access your cloud dashboard and files.</p>
    <form method="POST">
      <label>Email address</label>
      <input type="email" name="email" placeholder="you@example.com" required>
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
      <button class="btn full" type="submit">Sign In →</button>
    </form>
    <p class="auth-bottom">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
  </div>
</div>
{% endblock %}
