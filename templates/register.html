{% extends "base.html" %}
{% block title %}Create Account — CloudSphere{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">☁</div>
    <div class="eyebrow">GET STARTED</div>
    <h1>Create your account</h1>
    <p class="muted">Start managing your files in the cloud.</p>
    <form method="POST">
      <label>Full name</label>
      <input type="text" name="name" placeholder="Your name" required>
      <label>Email address</label>
      <input type="email" name="email" placeholder="you@example.com" required>
      <label>Password</label>
      <input type="password" name="password" placeholder="Minimum 6 characters" minlength="6" required>
      <label>Confirm password</label>
      <input type="password" name="confirm_password" placeholder="Repeat password" required>
      <button class="btn full" type="submit">Create Account →</button>
    </form>
    <p class="auth-bottom">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
